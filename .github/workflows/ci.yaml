# CI for Product Catalog Service

name: product-catalog-ci

on:
    pull_request:
        branches:
        - main
permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:
           go-version: '1.22.9'
           cache-dependency-path: src/product-catalog/go.sum

        - name: Download dependencies
          working-directory: src/product-catalog
          run: go mod download

        - name: Build
          working-directory: src/product-catalog
          run: go build ./...

        - name: unit tests
          working-directory: src/product-catalog
          run: go test ./...

    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:
           go-version: '1.22.9'
           cache-dependency-path: src/product-catalog/go.sum

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
           version: v1.64.8
           working-directory: src/product-catalog
           args: --timeout=5m

    docker:
        runs-on: ubuntu-latest

        needs:
          - build
          - code-quality

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: src/product-catalog/Dockerfile
            push: false
            tags: product-catalog:test
