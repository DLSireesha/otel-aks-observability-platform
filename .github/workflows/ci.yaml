
name: multi-service-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Product Catalog - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.9'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build
        working-directory: src/product-catalog
        run: go build ./...

      - name: Run tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    name: Product Catalog - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.9'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: src/product-catalog
          args: --timeout=5m

  docker-build:
    name: Docker Build - ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: accounting
            dockerfile: src/accounting/Dockerfile
          - service: ad
            dockerfile: src/ad/Dockerfile
          - service: checkout
            dockerfile: src/checkout/Dockerfile
          - service: currency
            dockerfile: src/currency/Dockerfile
          - service: email
            dockerfile: src/email/Dockerfile
          - service: flagd-ui
            dockerfile: src/flagd-ui/Dockerfile
          - service: fraud-detection
            dockerfile: src/fraud-detection/Dockerfile
          - service: frontend-proxy
            dockerfile: src/frontend-proxy/Dockerfile
          - service: frontend
            dockerfile: src/frontend/Dockerfile
          - service: image-provider
            dockerfile: src/image-provider/Dockerfile
          - service: kafka
            dockerfile: src/kafka/Dockerfile
          - service: load-generator
            dockerfile: src/load-generator/Dockerfile
          - service: payment
            dockerfile: src/payment/Dockerfile
          - service: postgres
            dockerfile: src/postgres/Dockerfile
          - service: product-catalog
            dockerfile: src/product-catalog/Dockerfile
          - service: quote
            dockerfile: src/quote/Dockerfile
          - service: recommendation
            dockerfile: src/recommendation/Dockerfile
          - service: shipping
            dockerfile: src/shipping/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:ci
