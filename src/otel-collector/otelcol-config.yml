receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}

exporters:
  debug:

  datadog:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE}

  otlphttp/dynatrace:
    endpoint: ${env:DT_ENDPOINT}
    headers:
      Authorization: Api-Token ${env:DT_API_TOKEN}

processors:
  batch:

  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(name, "\\?.*", "")
          - replace_match(name, "GET /api/products/*", "GET /api/products/{productId}")

service:
  pipelines:

    traces:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [datadog, otlphttp/dynatrace, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlphttp/dynatrace, debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [datadog, otlphttp/dynatrace, debug]
